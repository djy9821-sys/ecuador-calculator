<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hemat Listrik Kincir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the customer's comparison sheet as a phone page, under the WANGJIA name. Pond first, then the answer, then the sheet's groups A, B, C, D and investment. Brand blue and paddle yellow come from the product; green, grey and orange from the sheet. Yellow boxes mean "you can change this", as in the sheet. */
:root{
  --bg:#EEF1ED; --surface:#FFFFFF; --sunk:#F5F7F4; --ink:#17201B; --body:#36423C; --muted:#5F6C65; --line:#D8DFD9; --line2:#B4C0B7;
  --brand:#1066DC; --photo:#FFFFFF; --scrim:rgba(0,0,0,.88); --char:#3A403D; --ga:#6B726E; --gb:#1066DC; --gc:#4A7A2D; --gd:#2F4D1E; --gi:#B4520F; --on:#FFFFFF; --on-line:rgba(255,255,255,.3);
  --barb:#1066DC;
  --input:#FFF2CC; --input-fg:#0B39C4; --input-u:#7A6A35; --hot:#FFEE58; --hot-fg:#0B2FA8; --cell:#E3CF8E;
  --hl:#E2EFDA; --hl-fg:#2F4D1E; --sel:#E4EEFB;
  --water:#CFE8E2; --water-e:#6AAA9F; --dot:#17201B; --tag:#FACD0D; --tag-fg:#2A2600; --focus:#1F6FD0;
  --f-body:"Barlow",Roboto,system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --f-num:"Barlow Semi Condensed","sans-serif-condensed","Roboto Condensed",Roboto,system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1311; --surface:#171D1A; --sunk:#131815; --ink:#E7EDE9; --body:#C7D0CA; --muted:#94A098; --line:#2A332E; --line2:#414C45;
    --brand:#1066DC; --photo:#FFFFFF; --scrim:rgba(0,0,0,.88); --char:#2A302D; --ga:#59605C; --gb:#1C63C9; --gc:#42722A; --gd:#2B4A1B; --gi:#A64A0E; --on:#FFFFFF; --on-line:rgba(255,255,255,.3);
    --barb:#4C8DF0;
    --input:#36300F; --input-fg:#FFE38F; --input-u:#C9B777; --hot:#5B4F00; --hot-fg:#FFF27A; --cell:#6A5F2A;
    --hl:#20311A; --hl-fg:#B7DE99; --sel:#1B2A3A;
    --water:#1C3D38; --water-e:#4F958A; --dot:#E7EDE9; --tag:#FACD0D; --tag-fg:#2A2600; --focus:#6FB3F2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#171D1A; --sunk:#131815; --ink:#E7EDE9; --body:#C7D0CA; --muted:#94A098; --line:#2A332E; --line2:#414C45;
  --brand:#1066DC; --photo:#FFFFFF; --scrim:rgba(0,0,0,.88); --char:#2A302D; --ga:#59605C; --gb:#1C63C9; --gc:#42722A; --gd:#2B4A1B; --gi:#A64A0E; --on:#FFFFFF; --on-line:rgba(255,255,255,.3);
  --barb:#4C8DF0;
  --input:#36300F; --input-fg:#FFE38F; --input-u:#C9B777; --hot:#5B4F00; --hot-fg:#FFF27A; --cell:#6A5F2A;
  --hl:#20311A; --hl-fg:#B7DE99; --sel:#1B2A3A;
  --water:#1C3D38; --water-e:#4F958A; --dot:#E7EDE9; --tag:#FACD0D; --tag-fg:#2A2600; --focus:#6FB3F2;
  color-scheme:dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
[hidden]{ display:none !important; }
body{ background:var(--bg); color:var(--body); font-family:var(--f-body); font-size:.9375rem; line-height:1.45; -webkit-text-size-adjust:100%; padding-bottom:3.4rem; }
h1,h2,p,dl,dd,ul{ margin:0; }
button,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
.wrap{ max-width:1180px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }

header.top{ background:var(--brand); color:var(--on); }
header.top .wrap{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:3px 12px; padding-block:7px 9px; }
.logo{ display:block; height:1.6rem; width:auto; max-width:100%; }
.ttl{ grid-column:1 / -1; min-width:0; }
.ttl h1{ font:700 1.125rem/1.15 var(--f-num); letter-spacing:.005em; }
.ttl p{ font-size:.7812rem; line-height:1.3; opacity:.92; margin-top:1px; }
.lang{ grid-row:1; grid-column:2; display:inline-flex; border:1px solid var(--on-line); border-radius:6px; overflow:hidden; }
.lang button{ min-height:2.25rem; background:transparent; border:0; color:var(--on); font-size:.7812rem; font-weight:600; padding:0 10px; cursor:pointer; }
.lang button.on{ background:var(--on); color:var(--brand); }

.main{ display:flex; flex-direction:column; gap:12px; padding-block:12px; }
.col-l,.col-r,.duo{ display:contents; }
@media (max-width:719px){ #pick{ order:1; } #hero{ order:2; } #acts{ order:3; } #trade{ order:4; } #params{ order:5; } #compare{ order:6; } #ladder{ order:7; } #invest{ order:8; } }
@media (min-width:720px){
  .main{ display:grid; grid-template-columns:minmax(300px,36%) minmax(0,1fr); align-items:start; gap:12px; }
  .col-l,.col-r{ display:flex; flex-direction:column; gap:12px; min-width:0; }
}
@media (min-width:1100px){
  .main{ grid-template-columns:372px minmax(0,1fr); gap:14px; }
  .duo{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-items:start; }
}
.below{ display:flex; flex-direction:column; gap:12px; padding-bottom:18px; }

.sheet{ background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; min-width:0; }
.sh{ padding:11px 12px 8px; }
.sh h2,summary.sum b{ font:700 1.0625rem/1.2 var(--f-num); color:var(--ink); text-wrap:balance; }
.sh p{ font-size:.7812rem; color:var(--muted); margin-top:2px; }
.band{ display:flex; align-items:center; gap:7px; padding:6px 12px; color:var(--on); font-size:.875rem; font-weight:600; line-height:1.2; min-width:0; }
.band b{ font:700 1rem/1 var(--f-num); }
.ba{ background:var(--ga); } .bb{ background:var(--gb); } .bc{ background:var(--gc); } .bd{ background:var(--gd); } .bi{ background:var(--gi); } .bk{ background:var(--char); }

/* pond picker */
.scene{ position:relative; width:100%; padding-top:62.5%; overflow:hidden; background:var(--sunk); cursor:zoom-in; }
.scene img,.scene svg,.sc-d{ position:absolute; top:0; left:0; display:block; width:100%; height:100%; }
.scene img{ object-fit:cover; }
.sc-tag{ position:absolute; left:6px; top:6px; padding:1px 6px; border-radius:3px; background:var(--scrim); color:var(--on); font-size:.6875rem; line-height:1.4; }
.sc-cap{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 12px 8px; border-bottom:1px solid var(--line); }
.sc-t{ min-width:0; }
.sc-t b{ display:block; font-size:.9375rem; font-weight:600; line-height:1.25; color:var(--ink); }
.sc-t span{ display:block; font-size:.8125rem; line-height:1.3; color:var(--body); font-variant-numeric:tabular-nums; }
.sc-key{ flex:none; display:flex; flex-direction:column; align-items:center; gap:1px; font-size:.6875rem; line-height:1.2; color:var(--muted); white-space:nowrap; }
.sc-key img{ display:block; width:3.5rem; height:2.35rem; object-fit:contain; background:var(--photo); border:1px solid var(--line); border-radius:4px; }
.ponds{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr; gap:6px; padding:0 12px; }
.pond{ display:flex; flex-direction:column; gap:1px; min-width:0; padding:0 0 6px; overflow:hidden; text-align:left; background:var(--surface); border:1px solid var(--line2); border-radius:6px; cursor:pointer; }
@media (min-width:600px) and (max-width:719px){ .ponds{ grid-template-columns:repeat(6,minmax(0,1fr)); } .scene{ width:66%; padding-top:41.25%; margin:0 auto; } }
.pond span{ overflow-wrap:anywhere; }
.pond img{ display:block; width:100%; height:auto; margin-bottom:3px; }
.pond .nm,.pond .sp,.pond .ct{ padding:0 6px; }
.pond .nm{ font-size:.8125rem; font-weight:600; line-height:1.18; color:var(--ink); }
.pond .sp{ font-size:.75rem; line-height:1.25; color:var(--muted); margin-top:1px; }
.pond .ct{ font:600 .875rem/1.2 var(--f-num); color:var(--ink); margin-top:auto; padding-top:2px; }
.pond[aria-pressed="true"]{ border-color:var(--brand); box-shadow:0 0 0 1px var(--brand); background:var(--sel); }
.steps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr)); gap:10px; align-items:end; padding:10px 12px 12px; }
.step label{ display:block; font-size:.8125rem; font-weight:600; line-height:1.2; color:var(--ink); margin-bottom:4px; }
.stepper{ display:grid; grid-template-columns:2.6rem minmax(0,1fr) 2.6rem; height:2.75rem; border:1px solid var(--cell); border-radius:6px; overflow:hidden; }
.stepper button{ background:var(--sunk); border:0; font-size:1.3125rem; line-height:1; color:var(--ink); cursor:pointer; }
.stepper input{ width:100%; min-width:0; background:var(--input); color:var(--input-fg); border:0; border-inline:1px solid var(--cell); text-align:center; font:600 1.1875rem var(--f-num); font-variant-numeric:tabular-nums; }
.stepper input:focus{ outline:0; box-shadow:inset 0 0 0 2px var(--focus); }
.totline{ padding:0 12px 11px; font-size:.8125rem; color:var(--body); font-variant-numeric:tabular-nums; }

/* answer */
.hero{ background:var(--gd); color:var(--on); border-radius:6px; padding:12px 14px 12px; min-width:0; }
.hk{ font-size:.875rem; font-weight:600; }
.hv{ font:700 clamp(40px,12.4vw,66px)/1.04 var(--f-num); letter-spacing:-.005em; overflow-wrap:break-word; }
.hs{ font-size:.8438rem; line-height:1.3; margin-top:2px; }
.htag{ display:inline-block; background:var(--tag); color:var(--tag-fg); font-size:.7812rem; font-weight:600; line-height:1.3; padding:2px 7px; border-radius:3px; margin-top:7px; }
.hstats{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:10px; padding-top:9px; border-top:1px solid var(--on-line); }
.hstats dt{ font-size:.75rem; line-height:1.2; opacity:.88; }
.hstats dd{ font:600 1.125rem/1.2 var(--f-num); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.acts{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button.act{ flex:1 1 auto; min-height:2.625rem; background:var(--surface); color:var(--ink); border:1px solid var(--line2); border-radius:6px; font-size:.875rem; font-weight:600; padding:8px 12px; cursor:pointer; }
button.act:hover,.pond:hover{ border-color:var(--ink); }
#copyBox{ flex:1 1 100%; height:160px; width:100%; font-size:.8125rem; color:var(--ink); background:var(--sunk); border:1px solid var(--line2); border-radius:6px; padding:8px; }
#actMsg{ flex:1 1 100%; font-size:.8125rem; color:var(--muted); }

.mbar{ position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; background:var(--gd); color:var(--on); border:0; border-top:1px solid var(--on-line); cursor:pointer; text-align:left;
  padding:7px max(16px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); box-shadow:0 -4px 14px rgba(0,0,0,.18); transition:transform .18s ease; }
.mbar.off{ transform:translateY(110%); visibility:hidden; }
.mb-l{ min-width:0; font-size:.8125rem; line-height:1.25; }
.mb-r{ flex:none; font:700 1.25rem/1.1 var(--f-num); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.mb-r small{ font:500 .75rem var(--f-body); margin-left:2px; }
@media (prefers-reduced-motion:reduce){ .mbar{ transition:none; } }

/* basic numbers */
details>summary{ cursor:pointer; list-style:none; }
details>summary::-webkit-details-marker{ display:none; }
summary.sum{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; align-items:center; padding:10px 12px; }
summary.sum .go{ grid-column:2; grid-row:1 / span 2; font-size:.8125rem; font-weight:600; color:var(--ink); border:1px solid var(--line2); border-radius:6px; padding:6px 10px; white-space:nowrap; }
summary.sum small{ grid-column:1; font-size:.7812rem; line-height:1.35; color:var(--muted); font-variant-numeric:tabular-nums; }
details[open]>summary.sum .go{ visibility:hidden; }
details[open] #assume{ display:none; }
.pbody{ padding:0 12px 12px; }
.lede{ font-size:.8125rem; color:var(--body); padding-bottom:6px; }
.lede i{ font-style:normal; background:var(--input); color:var(--input-fg); padding:0 4px; border-radius:3px; }
.field{ display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
.field>label,.field>.lab{ flex:1 1 10rem; min-width:0; font-size:.875rem; font-weight:500; line-height:1.22; color:var(--ink); }
.field>.cell,.field>.auto{ flex:0 1 7.75rem; margin-left:auto; }
.field small{ display:block; font-size:.75rem; font-weight:400; line-height:1.3; color:var(--muted); margin-top:1px; }
.cell{ display:flex; align-items:center; min-width:0; background:var(--input); border:1px solid var(--cell); border-radius:4px; }
.cell:focus-within{ outline:2px solid var(--focus); outline-offset:1px; }
.cell input{ flex:1 1 auto; width:100%; min-width:0; background:transparent; border:0; outline:0; color:var(--input-fg); text-align:right; font:500 1rem var(--f-num); font-variant-numeric:tabular-nums; padding:7px 3px 7px 8px; }
.cell .u{ flex:none; font-size:.75rem; color:var(--input-u); padding-right:7px; white-space:nowrap; }
.cell.hot{ background:var(--hot); }
.cell.hot input{ color:var(--hot-fg); font-weight:700; }
.cell.hot input::placeholder{ color:var(--hot-fg); opacity:.55; }
.auto{ text-align:right; font:600 1rem var(--f-num); color:var(--ink); padding-right:7px; white-space:nowrap; }
.auto span{ font:400 .75rem var(--f-body); color:var(--muted); }
.field.wide{ flex-direction:column; align-items:stretch; flex-wrap:nowrap; }
.field.wide>label{ flex:none; }
.field.wide>.cell{ flex:none; margin-left:0; }
.tchips{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr)); gap:6px; padding:0 0 4px; }
button.chip{ text-align:left; background:var(--surface); border:1px solid var(--line2); border-radius:6px; padding:5px 8px; cursor:pointer; font-size:.8125rem; font-weight:600; line-height:1.25; color:var(--ink); }
button.chip small{ display:block; font-size:.7188rem; font-weight:400; color:var(--muted); }
button.chip.on{ border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); background:var(--sel); }
button.reset{ background:none; border:0; min-height:2.25rem; padding:6px 0 0; font-size:.8125rem; color:var(--muted); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }

/* A / B */
.cmp-h,.cmp-ph{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
.cmp-h .band{ align-items:flex-start; }
.cmp-ph>div{ padding:8px 12px 4px; min-width:0; }
.ph{ display:block; width:100%; max-width:22rem; aspect-ratio:4/3; padding:0; background:var(--photo); border:1px solid var(--line); border-radius:4px; overflow:hidden; cursor:zoom-in; }
.ph img{ display:block; width:100%; height:100%; object-fit:contain; }
.ty{ font-size:.8125rem; line-height:1.25; color:var(--ink); margin-top:5px; }
.zhint{ padding:0 12px 8px; font-size:.7812rem; color:var(--muted); }
.zoom{ position:fixed; top:0; right:0; bottom:0; left:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--scrim); color:var(--on); cursor:zoom-out;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px)); }
.zoom img{ display:block; max-width:100%; max-height:calc(100% - 6rem); background:var(--photo); border-radius:4px; }
.zoom p{ font-size:.9375rem; font-weight:600; text-align:center; }
.zx{ min-height:2.75rem; padding:0 18px; background:transparent; color:var(--on); border:1px solid var(--on-line); border-radius:6px; font-size:.9375rem; font-weight:600; cursor:pointer; }
.mrow{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); padding:6px 12px 7px; border-top:1px solid var(--line); }
.mrow .ml{ grid-column:1 / -1; font-size:.7812rem; line-height:1.3; color:var(--muted); }
.mrow .mv{ font:600 1.125rem/1.25 var(--f-num); color:var(--ink); font-variant-numeric:tabular-nums; min-width:0; overflow-wrap:anywhere; }
.mrow .mv+.mv{ padding-left:12px; }
.mrow .mv small{ font:500 .75rem var(--f-body); color:var(--muted); margin-left:2px; }
.bars{ display:flex; flex-direction:column; gap:7px; padding:8px 12px 11px; border-top:1px solid var(--line); }
.bl{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:0 10px; font:600 .875rem/1.25 var(--f-num); color:var(--ink); font-variant-numeric:tabular-nums; }
.bl .sv{ color:var(--hl-fg); }
.bt{ display:flex; gap:2px; height:.8rem; margin-top:3px; }
.bt i{ display:block; min-width:0; border-radius:0 4px 4px 0; }
.bt .fa{ background:var(--ga); }
.bt .fb{ background:var(--barb); }
.bt .fs{ background:repeating-linear-gradient(135deg,var(--hl) 0 5px,var(--surface) 5px 8px); box-shadow:inset 0 0 0 1px var(--gc); }

/* C, D and investment: running sums, one operation per line */
.lr{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 12px; border-top:1px solid var(--line); }
.band+.lad .lr:first-child,.lad:first-child .lr:first-child{ border-top:0; }
.lo{ min-width:0; font-size:.8438rem; line-height:1.3; color:var(--body); font-variant-numeric:tabular-nums; }
.lo small{ display:block; font-size:.75rem; color:var(--muted); }
.lv{ flex:none; max-width:64%; font:600 1.125rem/1.25 var(--f-num); color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.lv small{ font:500 .75rem var(--f-body); color:var(--muted); margin-left:3px; }
.lr.em{ background:var(--hl); }
.lr.em .lv{ font-weight:700; color:var(--hl-fg); }
.lr.em .lv small{ color:var(--hl-fg); }
.pbody.fl{ padding:6px 12px 2px; }
.pbody.fl .field:first-child{ border-top:0; }
.prompt{ padding:0 12px 10px; font-size:.8125rem; color:var(--muted); }

/* all ponds */
.tbar{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 12px; padding:11px 12px 8px; }
.tbar h2{ font:700 1.0625rem/1.2 var(--f-num); color:var(--ink); }
.tbar p{ font-size:.7812rem; color:var(--muted); margin-top:1px; }
.seg{ display:inline-flex; flex:none; border:1px solid var(--line2); border-radius:6px; overflow:hidden; }
.seg button{ min-height:2.25rem; background:var(--surface); border:0; padding:0 12px; font-size:.8125rem; font-weight:600; color:var(--body); cursor:pointer; }
.seg button.on{ background:var(--char); color:var(--on); }
.swipe{ padding:0 12px 8px; font-size:.7812rem; line-height:1.3; color:var(--muted); }
.tw{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line); }
table{ width:100%; border-collapse:separate; border-spacing:0; font-size:.8438rem; font-variant-numeric:tabular-nums; }
th,td{ padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); border-right:1px solid var(--line); white-space:nowrap; }
th:last-child,td:last-child{ border-right:0; }
tbody tr:last-child td{ border-bottom:0; }
tbody tr{ cursor:pointer; }
.l{ text-align:left; }
.hr th{ background:var(--sunk); color:var(--ink); font-size:.75rem; font-weight:600; line-height:1.25; white-space:normal; vertical-align:bottom; text-align:center; }
.hr th.l{ text-align:left; }
.hr small,td small{ display:block; font-size:.7188rem; font-weight:400; color:var(--muted); }
td b{ font-weight:600; color:var(--ink); }
td{ color:var(--ink); }
td.l{ white-space:normal; line-height:1.2; }
td.hl{ background:var(--hl); color:var(--hl-fg); font-weight:700; }
tr.on td:not(.hl){ background:var(--sel); }
.nw th{ color:var(--on); font-size:.8125rem; font-weight:600; line-height:1.2; white-space:normal; text-align:center; }

function t(k){ var s=TX[LANG][k]!=null?TX[LANG][k]:TX.en[k]; var a=arguments; if(typeof s==="string"){ s=s.replace(/\{(\d)\}/g,function(_,i){ return a[+i+1]; }); } return s; }

/* ---------- formatting ---------- */
// Rounds the way a spreadsheet displays a number: half up on the decimal value, so 1.575 shows as 1.58.
function fmt(x,d){
  if(!isFinite(x)) return "—";
  var f=Math.pow(10,d), y=Math.round(+(Math.abs(x)*f).toPrecision(12))/f;
  return (x<0?-y:y).toLocaleString(LOCALE[LANG],{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtN(x,d){ return isFinite(x) ? x.toLocaleString(LOCALE[LANG],{maximumFractionDigits:d==null?2:d}) : "—"; }
function sig(v){ return fmt(v, v<10?2 : v<100?1 : 0); }
function scaled(x,M){
  var a=Math.abs(x), sign=x<0?"−":"";
  if(LANG==="zh"){
    if(a>=1e8) return sign+sig(a/1e8)+"亿";
    if(a>=1e4) return sign+sig(a/1e4)+"万";
    return sign+fmt(a,0);
  }
  if(a>=1e12) return sign+sig(a/1e12)+" "+M.t;
  if(a>=1e9) return sign+sig(a/1e9)+" "+M.b;
  if(a>=1e6) return sign+sig(a/1e6)+" "+M.m;
  if(a>=1e3) return sign+fmt(a/1e3,0)+" "+M.k;
  return sign+fmt(a,0);
}

/* ---------- the calculation: same formulas as the sheet, letters are its columns ---------- */
function kwNew(p){ return p.kwOld*(1-p.rate/100); }   // B11
function row(p,units,area){
  var r={units:units, area:area};
  r.E = units===0 ? null : area/units;
  r.F = units*p.kwOld;    r.G = r.F*p.hours*p.days; r.H = r.G*p.tariff;
  r.I = units*kwNew(p);   r.J = r.I*p.hours*p.days; r.K = r.J*p.tariff;
  r.L = r.F-r.I;          r.M = r.L*p.hours;        r.N = r.M*p.days;   r.O = r.N*p.tariff;
  r.P = r.N*p.cycles;     r.Q = r.O*p.cycles;
  r.R = p.pOld==null ? null : units*p.pOld;
  r.S = p.pNew==null ? null : units*p.pNew;
  r.T = (r.R==null||r.S==null) ? null : r.S-r.R;
  r.U = (r.T==null||r.Q===0) ? null : (r.T<=0 ? "now" : r.T/r.Q);

}

/* ---------- drawings ---------- */
// How many aerators go in each ring when the count differs from the customer's layout: each ring keeps its share.
function ringsFor(q,u){
  var base=q.rings, total=base.reduce(function(x,y){ return x+y; },0);
  if(u===total) return base.slice();
  if(base.length===1) return u>12 ? [Math.ceil(u*0.6),Math.floor(u*0.4)] : [u];
  var exact=base.map(function(x){ return x*u/total; }), out=exact.map(Math.floor);
  var left=u-out.reduce(function(x,y){ return x+y; },0);
  exact.map(function(x,i){ return {i:i,rest:x-out[i]}; }).sort(function(a,b){ return b.rest-a.rest; }).slice(0,left).forEach(function(o){ out[o.i]++; });
  return out.filter(function(x){ return x>0; });
}
// A point on a rounded loop, measured clockwise from the middle of its top side, with the direction of travel.
function loopPoint(L,d){
  var x=L.x, y=L.y, w=L.w, h=L.h, r=L.r, sw=w-2*r, sh=h-2*r, arc=Math.PI*r/2, P=2*sw+2*sh+4*arc, a, deg=180/Math.PI;
  d=((d%P)+P)%P;
  if(d<sw/2) return {x:x+w/2+d,y:y,a:0};
  d-=sw/2;
  if(d<arc){ a=d/r; return {x:x+w-r+r*Math.sin(a),y:y+r-r*Math.cos(a),a:a*deg}; }
  d-=arc;
  if(d<sh) return {x:x+w,y:y+r+d,a:90};
  d-=sh;
  if(d<arc){ a=d/r; return {x:x+w-r+r*Math.cos(a),y:y+h-r+r*Math.sin(a),a:90+a*deg}; }
  d-=arc;
  if(d<sw) return {x:x+w-r-d,y:y+h,a:180};
  d-=sw;
  if(d<arc){ a=d/r; return {x:x+r-r*Math.sin(a),y:y+h-r+r*Math.cos(a),a:180+a*deg}; }
  d-=arc;
  if(d<sh) return {x:x,y:y+h-r-d,a:270};
  d-=sh;
  if(d<arc){ a=d/r; return {x:x+r-r*Math.cos(a),y:y+r-r*Math.sin(a),a:270+a*deg}; }
  d-=arc;
  return {x:x+r+d,y:y,a:0};
}

  rings.forEach(function(n,i){

    }

}

/* ---------- language ---------- */
function formatMoneyInputs(){ MONEY.forEach(function(id){ var d=$(id).value.replace(/\D/g,""); $(id).value=d?Number(d).toLocaleString(LOCALE[LANG]):""; }); }
function renderChips(){
  $("tariffChips").innerHTML=TARIFFS.map(function(s){ return '<button type="button" class="chip" data-v="'+s.v+'">'+s.k+' · Rp '+fmt(s.v,2)+'<small>'+t(s.s)+'</small></button>'; }).join("");
}
function applyLang(l){
  LANG=(l==="en"||l==="zh")?l:"id";
  document.documentElement.lang=LANG==="zh"?"zh-CN":LANG;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.innerHTML=t(el.dataset.i); });
  document.querySelectorAll(".lang button").forEach(function(b){ b.classList.toggle("on",b.dataset.l===LANG); });
  document.title=t("title");
  try{ localStorage.setItem("hemat_kincir_lang",LANG); }catch(e){}
  document.querySelectorAll("[data-zoom] img").forEach(function(im){ im.alt=t(im.parentElement.dataset.zoom); });
  $("keyImg").src=document.querySelector('[data-zoom="nB"] img').src;
  buildPonds(); renderChips(); formatMoneyInputs(); render();
}

/* ---------- events ---------- */
document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click",function(){ applyLang(b.dataset.l); }); });
$("ponds").addEventListener("click",function(e){
  var b=e.target.closest(".pond"); if(!b) return;
  var k=b.dataset.k; SEL=k; render();
  document.querySelector('.pond[data-k="'+k+'"]').focus();
});
function setUnits(k,v){ T[k].u=Math.max(0,Math.round(v)); }
$("units").addEventListener("input",function(){ var v=parseFloat(this.value); setUnits(SEL,isFinite(v)?v:0); render(); });
$("units").addEventListener("change",function(){ if(this.value==="") { T[SEL].u=pondDef(SEL).u; } this.value=T[SEL].u; render(); });
$("nPonds").addEventListener("input",render);
$("nPonds").addEventListener("change",function(){ this.value=nPonds(); render(); });
document.querySelectorAll("[data-st]").forEach(function(b){ b.addEventListener("click",function(){
  var d=+b.dataset.d;
  if(b.dataset.st==="units"){ setUnits(SEL,Math.max(1,T[SEL].u+d)); }
  else { $("nPonds").value=Math.max(1,nPonds()+d); }
  render();
}); });
NUMBERS.forEach(function(id){
  $(id).addEventListener("input",render);
  $(id).addEventListener("change",function(){ // an empty box goes back to the starting number, an impossible one to the nearest possible one
    var v=parseFloat(this.value), max=parseFloat(this.max);
    this.value=!isFinite(v)?BASE[id]:clamp(v,0,isFinite(max)?max:Infinity); render();
  });
});
MONEY.forEach(function(id){ $(id).addEventListener("input",function(){
  var el=this, before=el.value.slice(0,el.selectionStart).replace(/\D/g,"").length, d=el.value.replace(/\D/g,"").slice(0,14);
  el.value=d?Number(d).toLocaleString(LOCALE[LANG]):"";
  var i=0,c=0; while(i<el.value.length&&c<before){ if(/\d/.test(el.value[i])) c++; i++; }
  el.setSelectionRange(i,i);
  render();
}); });
$("tariffChips").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(b){ $("tariff").value=b.dataset.v; render(); } });
$("tShort").addEventListener("click",function(){ TFULL=false; render(); });
$("tFull").addEventListener("click",function(){ TFULL=true; render(); });
$("tbl").addEventListener("input",function(e){
  var m=/^([au])_(\w+)$/.exec(e.target.id); if(!m) return;
  var v=parseFloat(e.target.value); v=isFinite(v)&&v>=0?v:0;
  if(m[1]==="a") T[m[2]].a=v; else setUnits(m[2],v);
  render();
});
$("tbl").addEventListener("change",function(e){
  var m=/^([au])_(\w+)$/.exec(e.target.id); if(!m) return;
  if(e.target.value===""){ var fresh=freshT()[m[2]]; if(m[1]==="a") T[m[2]].a=fresh.a; else T[m[2]].u=fresh.u; }
  e.target.value=m[1]==="a"?Math.round(T[m[2]].a):T[m[2]].u;
  render();
});
$("tbl").addEventListener("click",function(e){
  if(e.target.tagName==="INPUT") return;
  var tr=e.target.closest("tr[data-k]"); if(tr){ SEL=tr.dataset.k; render(); }
});
$("reset").addEventListener("click",function(){
  IDS.forEach(function(id){ $(id).value=BASE[id]; });
  T=freshT(); SEL="sqM"; $("nPonds").value=1;
  formatMoneyInputs();
  render();
});
// Enlarged picture. The Android back button closes it through window.hematBack.
var zoomFrom=null;
function openZoom(src,cap,from){ zoomFrom=from; $("zoomImg").src=src; $("zoomImg").alt=$("zoomCap").textContent=cap; $("zoom").hidden=false; $("zoomX").focus(); }
function closeZoom(){ if($("zoom").hidden) return false; $("zoom").hidden=true; if(zoomFrom) zoomFrom.focus(); return true; }
window.hematBack=closeZoom;
document.querySelectorAll("[data-zoom]").forEach(function(b){ b.addEventListener("click",function(){
  openZoom(b.querySelector("img").src,t(b.dataset.zoom),b);
}); });
$("scene").addEventListener("click",function(){
  var im=document.querySelector(".sc-r:not([hidden])");
  if(im) openZoom(im.src,$("scName").textContent+" · "+$("scRings").textContent,null);
});
$("zoom").addEventListener("click",closeZoom);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeZoom(); });
$("copy").addEventListener("click",function(){
  var txt=summary(), btn=$("copy"), box=$("copyBox"), msg=$("actMsg");
  function fail(){ box.value=txt; box.hidden=false; box.focus(); box.select(); msg.textContent=t("copyFail"); msg.hidden=false; }
  if(!navigator.clipboard){ fail(); return; }
  navigator.clipboard.writeText(txt).then(function(){ btn.textContent=t("copied"); box.hidden=true; msg.hidden=true; setTimeout(function(){ btn.textContent=t("copy"); },1500); },fail);
});
// The Excel sheet is embedded by scripts/build_artifact.py and needs the viewer's downloads capability.
if(XLSX_B64.indexOf("__")!==0 && window.claude && window.claude.use){
  window.claude.use("downloads").then(function(dl){
    if(!dl) return;
    $("dl").hidden=false;
    $("dl").addEventListener("click",function(){
      var bin=atob(XLSX_B64), bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      dl.save({filename:"perbandingan-hemat-listrik-kincir.xlsx",data:bytes}).catch(function(e){
        if(e&&(e.code==="declined"||e.code==="rate_limited")) return;
        $("actMsg").textContent=t("dlFail"); $("actMsg").hidden=false; $("dl").hidden=true;
      });
    });
  });
}

$("mbar").addEventListener("click",function(){
  var calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  $("hero").scrollIntoView({behavior:calm?"auto":"smooth",block:"center"});
});
if("IntersectionObserver" in window){
  new IntersectionObserver(function(es){ es.forEach(function(e){ $("mbar").classList.toggle("off",e.intersectionRatio>=0.5); }); },{threshold:[0,0.5,1]}).observe($("hero"));
}
window.addEventListener("resize",swipeHint);

/* ---------- start ---------- */
var saved=null, lang=null;
try{ saved=JSON.parse(localStorage.getItem(KEY)); lang=localStorage.getItem("hemat_kincir_lang"); }catch(e){ saved=null; }
T=freshT();
IDS.forEach(function(id){ $(id).value=BASE[id]; });
$("nPonds").value=1;
if(saved){
  if(saved.v) IDS.forEach(function(id){ if(saved.v[id]!=null) $(id).value=saved.v[id]; });
  if(saved.T) Object.keys(T).forEach(function(k){ var o=saved.T[k]; if(o&&isFinite(o.u)&&isFinite(o.a)) T[k]={u:o.u,a:o.a}; });
  if(saved.sel&&T[saved.sel]) SEL=saved.sel;
  if(saved.n) $("nPonds").value=saved.n;
}
// Wide screens have room for the inputs and the whole sheet; phones open with the answer.
if(window.matchMedia&&window.matchMedia("(min-width:1000px)").matches){ $("params").open=true; $("notes").open=true; TFULL=true; }
applyLang(lang||"id");
})();
</script>
</body>
</html>
